# ── PaddleOCR-VL Layout Parsing Server ──────────────────────────────
# 用法：
#   1) 仅启动本服务（默认，AI Studio 托管模式或连外部 vLLM）：
#        cp .env.example .env   # 按需填写 AI_STUDIO_TOKEN
#        docker compose up -d --build
#   2) 需要内置 vLLM（GPU）时：取消下面 vllm 服务注释后重新 up -d
#
# 获取管理员 token（所有接口需 Bearer 鉴权，包括 /health）：
#       docker compose logs layout-server | grep "Admin token"
#
# 健康检查使用 TCP 探测（/health 也在鉴权之下，无法无 token HTTP 探测）。
#
# 兼容性说明：
#   - version 声明为 3.8，兼容 docker-compose v1.27+ 与 v2；
#   - 使用 "${VAR:-default}" 插值（v1.25+ / v2 均支持），.env 可覆盖带默认值的项；
#   - .env 中 AI_STUDIO_TOKEN 留空 = 走本地 vLLM 模式。

version: "3.8"

services:
  layout-server:
    build: .
    image: paddleocr-vl-layout-server:latest
    container_name: paddleocr-vl-layout-server
    ports:
      # 宿主机端口：8399（需要改端口时修改左边数字即可）
      - "8399:8399"
    environment:
      PORT: "8399"
      # —— 二选一：本地 vLLM 模式 ——
      # 默认指向内置 vllm 服务（取消注释 vllm 服务后生效）；
      # 连外部 vLLM 时在 .env 里覆盖 VLLM_SERVER_URL
      VLLM_SERVER_URL: ${VLLM_SERVER_URL:-http://vllm:8000/v1}
      # —— 二选一：AI Studio 托管模式（配置后优先，无需 vLLM）——
      # 在 .env 中设置 AI_STUDIO_TOKEN；留空则走本地模式
      AI_STUDIO_TOKEN: ${AI_STUDIO_TOKEN}
      AI_STUDIO_MODEL: ${AI_STUDIO_MODEL:-PaddleOCR-VL-1.6}
      AI_STUDIO_TIMEOUT: ${AI_STUDIO_TIMEOUT:-1800}
      # —— 容器内路径（需与下方 volumes 挂载点一致；一般无需修改）——
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      JOBS_DIR: ${JOBS_DIR:-/app/data/uploads/jobs}
      USER_DB_PATH: ${USER_DB_PATH:-/app/data/user.json}
      # —— 通用配置 ——
      # 生产环境请改成随机长字符串，且保持稳定（改动会使旧 token 失效）
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MAX_BATCH_WORKERS: ${MAX_BATCH_WORKERS:-2}
      ARCHIVE_RESULT_TTL_SECONDS: ${ARCHIVE_RESULT_TTL_SECONDS:-604800}
    volumes:
      # 持久化：上传/任务/用户库、Paddle 模型缓存（首次本地模式运行会下载 ~125MB）
      - layout-data:/app/data
      - paddlex-models:/home/app/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8399), timeout=3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # 可选：内置 vLLM（PaddleOCR-VL），需要 NVIDIA GPU + nvidia-container-toolkit。
  # 需要时取消注释，然后：docker compose up -d --build
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   command: ["PaddlePaddle/PaddleOCR-VL", "--trust-remote-code", "--max-num-batched-tokens", "16384", "--no-enable-prefix-caching"]
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ~/.cache/huggingface:/root/.cache/huggingface
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   restart: unless-stopped

volumes:
  layout-data:
  paddlex-models:
